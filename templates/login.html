<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 - 计算机信息 OCR 系统</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.login-card {
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    width: 360px;
}
h2 { margin: 0 0 24px 0; text-align: center; color: #333; }
label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
input[type=text], input[type=password] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
}
input:focus { outline: none; border-color: #667eea; }
button {
    width: 100%;
    padding: 12px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}
button:hover { background: #5568d3; }
.tip { text-align: center; color: #888; font-size: 12px; margin-top: 16px; }
.flash { padding: 10px; border-radius: 6px; margin-bottom: 16px; background: #fee; color: #c33; font-size: 13px; }
</style>
</head>
<body>
<form class="login-card" method="POST" action="{{ url_for('login') }}">
    <h2>🔐 内部登录</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <label>账号</label>
    <input type="text" name="username" required autofocus>
    <label>密码</label>
    <input type="password" name="password" required>
    <button type="submit">登 录</button>
    <div class="tip">仅限内部人员使用</div>
</form>
</body>
</html>
